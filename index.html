<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>サーモンラン バイト記録</title>
<meta name="description" content="配信中のサーモンランのリザルトを自動で集計した記録ページ">
<style>
  :root {
    --bg: #f4f5f0;
    --panel: #ffffff;
    --ink: #1b1d17;
    --muted: #6b6f63;
    --line: #e2e4dc;
    --accent: #9bc400;
    --accent-ink: #4d6300;
    --accent-soft: #eef7cc;
    --gold: #c98a00;
    --shadow: 0 1px 2px rgba(20, 24, 10, .06), 0 4px 16px rgba(20, 24, 10, .05);
    --font: "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121410;
      --panel: #1b1e18;
      --ink: #eef0e8;
      --muted: #9a9f90;
      --line: #2c3027;
      --accent: #c6f432;
      --accent-ink: #c6f432;
      --accent-soft: #2a3313;
      --gold: #ffc23d;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 24px; }
  h1 { font-size: clamp(22px, 4vw, 30px); margin: 0; letter-spacing: .02em; }
  h1 .mark { display: inline-block; width: .55em; height: .55em; border-radius: 3px; background: var(--accent); margin-right: .4em; transform: translateY(-.1em); }
  .updated { color: var(--muted); font-size: 13px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  section { margin-top: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 30px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
  .card .value small { font-size: 14px; font-weight: 600; margin-left: 2px; color: var(--muted); }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card.best { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), var(--panel)); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.total td { font-weight: 700; }
  .scroll { overflow-x: auto; }
  .q { color: var(--muted); font-size: 12px; }
  .rec { color: var(--gold); font-weight: 700; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink); margin-left: 4px; }
  td.hl { color: var(--accent-ink); font-weight: 800; }

  .tabs { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 3px; margin-bottom: 12px; }
  .tabs { max-width: 100%; overflow-x: auto; }
  .tabs button { white-space: nowrap; flex: none; }
  .tabs button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 4px 14px; border-radius: 99px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: var(--shadow); }

  .chartbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 12px; }
  .chartwrap { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .chart .axis { stroke: var(--line); }
  .chart .tick { fill: var(--muted); font-size: 12px; }
  .chart .tick.day { fill: var(--ink); font-weight: 700; }
  .chart .vtick { stroke: var(--muted); }
  .chart .brk { stroke: var(--muted); stroke-dasharray: 3 4; opacity: .6; }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .chart .bestref { stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .chart .pt { fill: var(--accent-ink); }
  .chart .pt.fail { fill: var(--panel); stroke: #d9534f; stroke-width: 2; }
  .chart .pt.rec { fill: var(--gold); }
  .chart .bar.ok { fill: var(--accent); }
  .chart .bar.fail { fill: #e8908d; }
  .chart .bar.rec { fill: var(--gold); }
  .chart .best { fill: none; stroke: var(--accent); stroke-width: 3; }
  .chart .avg { fill: none; stroke: #4f8ff7; stroke-width: 2; opacity: .85; }
  .chart .endlabel { font-size: 12px; font-weight: 800; }
  .chart .endlabel.best { fill: var(--accent-ink); stroke: none; }
  .chart .endlabel.avg { fill: #4f8ff7; stroke: none; }
  .chart .guide { stroke: var(--ink); stroke-width: 1; opacity: .35; }
  .chart .hl { fill: none; stroke: var(--ink); stroke-width: 2; }
  .tip { position: absolute; top: 6px; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(0,0,0,.15); border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.5; white-space: nowrap; }
  .tip b { font-size: 15px; }
  .legend .lg { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .legend .lg.best { width: 16px; height: 3px; background: var(--accent); border-radius: 2px; }
  .legend .lg.avg { width: 16px; height: 2px; background: #4f8ff7; }
  .legend .lg.bestref { width: 16px; height: 0; border-top: 2px dashed var(--gold); }
  .legend .lg.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
  .legend .lg.dot.fail { background: var(--panel); border: 1.8px solid #d9534f; }
  .legend .lg.dot.rec { background: var(--gold); }
  .legend .lg.brk { width: 0; height: 12px; border-left: 2px dashed var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .more { margin-top: 10px; text-align: center; }
  .more button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 18px; border-radius: 99px; cursor: pointer; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }

  .contest { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 12px; }
  .pick { display: flex; align-items: center; gap: 10px; }
  .pick .label { color: var(--muted); font-size: 12px; }
  .pick select { font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
  .contest .info { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
  .contest .filter { margin: 0 0 0 auto; }
  .contest .info b { color: var(--ink); font-weight: 700; }
  .live { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 99px;
    background: var(--accent); color: #1b1d17; margin-right: 6px; }
  .dsum { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .dsum b { color: var(--ink); font-size: 15px; }
  .dist { max-height: 420px; overflow: auto; }
  .dist th { position: sticky; top: 0; background: var(--panel); }
  .dist td.bar { width: 45%; text-align: left; }
  .dist .b { display: block; height: 12px; border-radius: 3px; background: var(--accent); min-width: 2px; }
  .dist tr.under .b { background: var(--muted); opacity: .5; }
  .dist tr.top td:first-child { color: var(--accent-ink); font-weight: 800; }
  .bestrun { margin-top: 12px; }
  .bestrun:empty { display: none; }
  .bestrun .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 10px; }
  .bestrun .head h3 { margin: 0; font-size: 15px; }
  .bestrun .head span { color: var(--muted); font-size: 13px; }
  .bestrun .wv { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .bestrun .w { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: center; background: var(--bg); }
  .bestrun .w .n { font-size: 12px; color: var(--muted); }
  .bestrun .w .e { font-size: 24px; font-weight: 800; line-height: 1.2; }
  .bestrun .w .e small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .bestrun .w.top { border-color: var(--accent); background: var(--accent-soft); }
  .bestrun .w.sum { border-color: var(--accent); }
  .unk { display: inline-block; min-width: 1.2em; text-align: center; font-weight: 800; color: #b26b00;
    background: rgba(255, 170, 0, .18); border-radius: 4px; padding: 0 3px; }
  .ok { color: var(--accent-ink); font-weight: 700; }
  .ng { color: #d9534f; font-weight: 700; }
  #hours td.bar { width: 35%; text-align: left; }
  #hours .b { display: block; height: 12px; border-radius: 3px; background: var(--accent); min-width: 2px; }
  #hours tr.top td:first-child { color: var(--accent-ink); font-weight: 800; }
  .disttable td.bar { width: 45%; text-align: left; }
  .disttable .b { display: block; height: 12px; border-radius: 3px; background: var(--accent); min-width: 2px; }
  .disttable tr.under .b { background: var(--muted); opacity: .5; }
  .disttable tr.top td:first-child { color: var(--accent-ink); font-weight: 800; }
  .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .pager:empty { display: none; }
  .pager button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 14px; border-radius: 99px; cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }
  #shiftList tr[data-k] { cursor: pointer; }
  #shiftList tr.sel td { background: var(--accent-soft); }
  .kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--ink); margin-right: 6px; }
  .kind.k-contest { border-color: var(--accent); color: var(--accent-ink); }
  .kind.k-bigrun { border-color: var(--gold); color: var(--gold); }
  @media (max-width: 560px) {
    .wrap { padding-top: 20px; }
    .panel { padding: 12px; }
    th, td { padding: 7px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="mark"></span>サーモンラン バイト記録</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div class="contest panel">
    <label class="pick">
      <span class="label">シフト</span>
      <select id="shift"></select>
    </label>
    <div class="info" id="shiftInfo"></div>
    <div class="tabs filter" role="tablist" id="clearFilter">
      <button role="tab" aria-selected="true" data-f="all">すべて</button>
      <button role="tab" aria-selected="false" data-f="clear">クリアのみ</button>
      <button role="tab" aria-selected="false" data-f="fail">失敗のみ</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel bestrun" id="bestRun"></div>

  <section>
    <h2>WAVEごとの記録</h2>
    <div class="panel scroll"><table id="waves"></table></div>
  </section>

  <section>
    <h2>イクラの推移</h2>
    <div class="chartbar">
      <div class="tabs" role="tablist" id="chartTabs"></div>
      <div class="tabs" role="tablist" id="chartType">
        <button role="tab" aria-selected="false" data-t="line">折れ線</button>
        <button role="tab" aria-selected="true" data-t="bar">棒グラフ</button>
      </div>
      <div class="tabs" role="tablist" id="chartRange">
        <button role="tab" aria-selected="false" data-n="30">直近30回</button>
        <button role="tab" aria-selected="false" data-n="100">直近100回</button>
        <button role="tab" aria-selected="true" data-n="0">すべて</button>
      </div>
    </div>
    <div class="panel chart">
      <div class="chartwrap">
        <div id="chart"></div>
        <div class="tip" id="chartTip" hidden></div>
      </div>
      <div class="legend">
        <span><i class="lg bestref"></i>最高記録の高さ</span>
        <span><i class="lg dot"></i>クリア</span>
        <span><i class="lg dot fail"></i>失敗</span>
        <span><i class="lg dot rec"></i>最高記録のバイト</span>
        <span><i class="lg brk"></i>1時間以上あいたところ</span>
      </div>
      <div class="q" style="margin-top:4px">点にマウスを乗せる（スマホはタップ）と、そのバイトの記録が出ます</div>
    </div>
  </section>

  <section>
    <h2>WAVEごとの詳細</h2>
    <div class="tabs" role="tablist" id="detailTabs"></div>
    <div class="panel">
      <div class="dsum" id="detailSum"></div>
      <div class="scroll"><table id="detail" class="disttable"></table></div>
      <div class="pager" id="detailPager"></div>
    </div>
  </section>

  <section>
    <h2>赤イクラの記録</h2>
    <div class="panel">
      <div class="dsum" id="redSum"></div>
      <div class="dist"><table id="redDist"></table></div>
    </div>
  </section>

  <section>
    <h2>時間帯ごとの成績</h2>
    <div class="panel scroll"><table id="hours"></table></div>
  </section>

  <section>
    <h2>自己ベストの更新履歴</h2>
    <div class="panel scroll dist"><table id="pbs"></table></div>
  </section>

  <section>
    <h2>シフト一覧</h2>
    <div class="panel scroll"><table id="shiftList"></table></div>
  </section>

  <section>
    <h2>全リザルト</h2>
    <div class="q" id="allNote" style="margin:-6px 0 8px"></div>
    <div class="panel scroll"><table id="all"></table></div>
    <div class="more" id="more"></div>
  </section>

  <footer>配信のリザルト画面から自動で読み取った記録です。読み取れなかったバイトは含まれていません。</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtDate = d => `${d.getMonth() + 1}/${d.getDate()}`;
const fmtTime = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const r1 = x => (Math.round(x * 10) / 10).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

let allRuns = [];   // 全リザルト
let runs = [];      // 選んでいるシフトのリザルト
let shifts = {};    // shifts.json（シフトの種類・期間・ステージ・ブキ）
let selected = null;
let shown = 30;
let clearFilter = "all";  // all / clear / fail
// 選んでいるシフトのリザルトを、クリア/失敗の絞り込みに合わせて取り出す
const pickAll = k => allRuns.filter(r => keyOf(r) === k &&
  (clearFilter === "all" || (clearFilter === "clear" ? r.clear === true : r.clear === false)));
const pick = k => allRuns.filter(r => keyOf(r) === k && r.complete &&
  (clearFilter === "all" || (clearFilter === "clear" ? r.clear === true : r.clear === false)));
const KIND = { contest: "バイトチームコンテスト", bigrun: "ビッグラン", regular: "通常バイト", unknown: "不明" };
const keyOf = r => r.shift || r.contest || "unknown";
const kindOf = k => (shifts[k] && shifts[k].kind) || "unknown";
const startOf = k => {
  const c = shifts[k];
  return new Date(c && c.start ? c.start : k.replace(" ", "T"));
};
const fmtFull = d => `${fmtDate(d)}（${"日月火水木金土"[d.getDay()]}）${fmtTime(d)}`;

function shiftLabel(k) {
  const c = shifts[k] || {};
  const s = startOf(k);
  const e = c.end ? new Date(c.end) : null;
  const period = e ? `${fmtDate(s)} ${fmtTime(s)}〜${fmtDate(e)} ${fmtTime(e)}` : `${fmtDate(s)}〜`;
  return `${period} ${c.stage || ""}`.trim();
}

function shiftKeys() {
  return [...new Set(allRuns.map(keyOf))].sort((a, b) => startOf(b) - startOf(a));
}

function select(k) {
  selected = k;
  runs = pick(k);
  shown = 30;
  detailPage = 0;
  try { history.replaceState(null, "", "#" + encodeURIComponent(k)); } catch (e) {}
  render();
}

function renderShiftPicker() {
  const keys = shiftKeys();
  // 種類ごとにまとめて並べる（コンテスト → ビッグラン → 通常）
  const groups = ["contest", "bigrun", "regular", "unknown"].map(kind => {
    const ks = keys.filter(k => kindOf(k) === kind);
    return ks.length ? `<optgroup label="${KIND[kind]}">` +
      ks.map(k => `<option value="${esc(k)}"${k === selected ? " selected" : ""}>${esc(shiftLabel(k))}</option>`).join("") +
      `</optgroup>` : "";
  }).join("");
  $("shift").innerHTML = groups || `<option>記録なし</option>`;
  const c = shifts[selected];
  if (!selected) { $("shiftInfo").innerHTML = ""; return; }
  const kindTag = `<span class="kind k-${kindOf(selected)}">${KIND[kindOf(selected)]}</span>`;
  if (!c || !c.end) { $("shiftInfo").innerHTML = `<span>${kindTag}期間・ステージの情報はありません</span>`; return; }
  const s = startOf(selected), e = new Date(c.end), now = new Date();
  const live = s <= now && now < e;
  $("shiftInfo").innerHTML =
    `<span>${kindTag}${live ? '<span class="live">開催中</span>' : ""}期間 <b>${fmtFull(s)} 〜 ${fmtFull(e)}</b></span>` +
    (c.stage ? `<span>ステージ <b>${esc(c.stage)}</b></span>` : "") +
    (c.weapons && c.weapons.length ? `<span>ブキ <b>${c.weapons.map(esc).join("・")}</b></span>` : "");
}

function renderShiftList() {
  const rows = shiftKeys().map(k => {
    const list = allRuns.filter(r => keyOf(r) === k && r.complete);
    if (!list.length) return "";
    const totals = list.map(r => r.total);
    const rec = list.some(r => r.new && r.new.length);
    return `<tr data-k="${esc(k)}"${k === selected ? ' class="sel"' : ""}>
      <td>${esc(shiftLabel(k))}${rec ? '<span class="badge">記録更新</span>' : ""}</td>
      <td class="q">${KIND[kindOf(k)]}</td>
      <td>${list.length}</td><td class="hl">${Math.max(...totals)}</td><td>${r1(avg(totals))}</td><td>${Math.min(...totals)}</td></tr>`;
  });
  $("shiftList").innerHTML = rows.length
    ? `<thead><tr><th>シフト</th><th>種類</th><th>回数</th><th>最高合計</th><th>平均合計</th><th>最低合計</th></tr></thead><tbody>${rows.join("")}</tbody>`
    : `<tbody><tr><td class="empty">まだ記録がありません</td></tr></tbody>`;
  $("shiftList").querySelectorAll("tr[data-k]").forEach(tr => tr.onclick = () => {
    select(tr.dataset.k);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

// 合計が一番多いバイト。合計が同じなら赤イクラが多い方、それも同じなら先に出した方
function bestTotalRun(list) {
  const red = r => (typeof r.red === "number" ? r.red : -1);
  return list.reduce((a, b) => (b.total > a.total || (b.total === a.total && red(b) > red(a)) ? b : a));
}

function card(label, value, unit, sub, cls = "") {
  return `<div class="card ${cls}"><div class="label">${label}</div>
    <div class="value">${value}<small>${unit}</small></div><div class="sub">${sub}</div></div>`;
}

function renderCards() {
  if (!runs.length) { $("cards").innerHTML = ""; return; }
  const totals = runs.map(r => r.total);
  const best = bestTotalRun(runs);
  const recent = totals.slice(-10);
  const first = runs[0].d, last = runs[runs.length - 1].d;
  // クリア判定のあるリザルトだけで数える
  const judged = runs.filter(r => r.clear === true || r.clear === false);
  const cleared = judged.filter(r => r.clear).length;
  const reds = runs.filter(r => typeof r.red === "number");
  const exs = runs.filter(r => r.ex === true || r.ex === false);  // EX-WAVE があったバイト
  const bestRed = reds.length ? reds.reduce((a, b) => (b.red > a.red ? b : a)) : null;
  const dream = dreamTotal();
  $("cards").innerHTML =
    card("最高合計", best.total, "個", `${fmtDate(best.d)} ${fmtTime(best.d)}`, "best") +
    card("平均合計", r1(avg(totals)), "個", `直近10回 ${r1(avg(recent))}個`) +
    (dream ? card("全WAVEで最高を出せたら", dream, "個", `最高合計まで あと${dream - best.total}個`) : "") +
    card("クリア率", judged.length ? Math.round(cleared / judged.length * 100) : "−", judged.length ? "%" : "",
      judged.length ? `${cleared}/${judged.length}回クリア` : "判定できた記録なし") +
    (exs.length ? card("オカシラ撃破率", Math.round(exs.filter(r => r.ex).length / exs.length * 100), "%",
      `${exs.filter(r => r.ex).length}/${exs.length}回撃破`) : "") +
    card("赤イクラ", bestRed ? bestRed.red : "−", bestRed ? "個" : "",
      bestRed ? `最高（平均 ${Math.round(avg(reds.map(r => r.red)))}個・${reds.length}回分）` : "まだ記録なし") +
    card("バイト回数", runs.length, "回", `${fmtDate(first)} ${fmtTime(first)} 〜 ${fmtDate(last)} ${fmtTime(last)}`);
}

// 最高合計を出したバイトの WAVE ごとの内訳（同じ合計が複数あれば最初に出したもの）
function renderBestRun() {
  if (!runs.length) { $("bestRun").innerHTML = ""; return; }
  const best = bestTotalRun(runs);
  const ties = runs.filter(r => r.total === best.total).length;
  const waveBest = i => Math.max(...runs.filter(r => r.waves[i]).map(r => r.waves[i][0]));
  const cells = best.waves.map((w, i) => {
    const top = w[0] === waveBest(i);  // そのWAVEの最高とも同じなら色付き
    return `<div class="w${top ? " top" : ""}" title="${top ? "このWAVEの最高と同じ" : ""}">
      <div class="n">WAVE ${i + 1}</div><div class="e">${w[0]}<small>/${w[1]}</small></div></div>`;
  }).join("");
  const res = (best.clear === true ? '<span class="ok">クリア</span>' : best.clear === false ? '<span class="ng">失敗</span>' : "")
    + (best.ex === true ? " / オカシラ撃破" : best.ex === false ? " / オカシラNG" : "");
  $("bestRun").innerHTML =
    `<div class="head"><h3>最高合計 ${best.total}個のバイト</h3>
      <span>${fmtFull(best.d)}${ties > 1 ? `（同じ合計 ほか${ties - 1}回）` : ""}</span>${res ? `<span>${res}</span>` : ""}
      ${typeof best.red === "number" ? `<span>赤イクラ ${best.red}個</span>` : ""}</div>
    <div class="wv">${cells}<div class="w sum"><div class="n">合計</div><div class="e">${best.total}</div></div></div>`;
}

// 各WAVEの最高を足した数（いちばん多くWAVEまで進んだバイトの数だけ足す）
function dreamTotal() {
  const maxW = Math.max(0, ...runs.map(r => r.waves.length));
  let sum = 0;
  for (let i = 0; i < maxW; i++) {
    const vals = runs.filter(r => r.waves[i]).map(r => r.waves[i][0]);
    if (!vals.length) return 0;
    sum += Math.max(...vals);
  }
  return sum;
}

// 赤イクラ: まとめと、500個ごとの分布
function renderRed() {
  const list = runs.filter(r => typeof r.red === "number");
  if (!list.length) {
    $("redSum").innerHTML = "";
    $("redDist").innerHTML = `<tbody><tr><td class="empty">まだ記録がありません（ボットが赤イクラの数字を読めたリザルトから記録されます）</td></tr></tbody>`;
    return;
  }
  const vals = list.map(r => r.red).sort((a, b) => a - b);
  const best = list.reduce((a, b) => (b.red > a.red ? b : a));
  const median = vals.length % 2 ? vals[(vals.length - 1) / 2] : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2;
  // 合計金イクラとの関係（金イクラ1個あたりの赤イクラ）
  const perGold = avg(list.map(r => r.red / Math.max(1, r.total)));
  $("redSum").innerHTML =
    `<span>最高 <b>${best.red}</b>個（${fmtDate(best.d)} ${fmtTime(best.d)}）</span>` +
    `<span>平均 <b>${Math.round(avg(vals))}</b></span><span>中央値 <b>${Math.round(median)}</b></span>` +
    `<span>最低 <b>${vals[0]}</b></span><span>記録 <b>${list.length}</b>回</span>` +
    `<span>金イクラ1個あたり <b>${r1(perGold)}</b>個</span>`;
  const STEP = 500;
  const map = new Map();
  for (const r of list) {
    const k = Math.floor(r.red / STEP) * STEP;
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  }
  const most = Math.max(...[...map.values()].map(a => a.length));
  const top = Math.floor(best.red / STEP) * STEP;
  const rows = [...map.entries()].sort((a, b) => b[0] - a[0]).map(([k, rs]) => {
    const last = rs[rs.length - 1].d;
    return `<tr class="${k === top ? "top" : ""}"><td>${k}〜${k + STEP - 1}個</td><td>${rs.length}回</td>
      <td>${Math.round(rs.length / list.length * 1000) / 10}%</td>
      <td class="bar"><span class="b" style="width:${rs.length / most * 100}%"></span></td>
      <td class="q">${fmtDate(last)} ${fmtTime(last)}</td></tr>`;
  });
  $("redDist").innerHTML = `<thead><tr><th>赤イクラ</th><th>回数</th><th>割合</th><th></th><th>最後に出した日時</th></tr></thead><tbody>${rows.join("")}</tbody>`;
}

function renderHours() {
  if (!runs.length) { $("hours").innerHTML = `<tbody><tr><td class="empty">まだ記録がありません</td></tr></tbody>`; return; }
  const map = new Map();
  for (const r of runs) {
    const h = r.d.getHours();
    if (!map.has(h)) map.set(h, []);
    map.get(h).push(r);
  }
  const avgs = [...map.values()].map(l => avg(l.map(r => r.total)));
  const top = Math.max(...avgs), lo = Math.min(...avgs);
  const rows = [...map.entries()].sort((a, b) => ((a[0] + 18) % 24) - ((b[0] + 18) % 24)).map(([h, list]) => {
    const totals = list.map(r => r.total);
    const a = avg(totals);
    const judged = list.filter(r => r.clear === true || r.clear === false);
    const rate = judged.length ? `${Math.round(judged.filter(r => r.clear).length / judged.length * 100)}%` : "−";
    const w = top === lo ? 100 : 15 + (a - lo) / (top - lo) * 85;
    return `<tr class="${a === top && map.size > 1 ? "top" : ""}"><td>${h}時台</td><td>${list.length}回</td>
      <td class="hl">${r1(a)}</td><td class="bar"><span class="b" style="width:${w}%"></span></td>
      <td>${Math.max(...totals)}</td><td>${rate}</td></tr>`;
  });
  $("hours").innerHTML = `<thead><tr><th>時間帯</th><th>回数</th><th>平均合計</th><th></th><th>最高合計</th><th>クリア率</th></tr></thead><tbody>${rows.join("")}</tbody>`;
}

// 自己ベストを更新した瞬間を、古いものから順に拾う（そのシフトの最初のリザルトは「最初の記録」なので含めない）
function renderPBs() {
  const best = {};
  const list = [];
  for (const r of runs) {
    const items = [["合計", r.total], ...r.waves.map((w, i) => [`WAVE ${i + 1}`, w[0]])];
    if (typeof r.red === "number") items.push(["赤イクラ", r.red]);
    for (const [name, v] of items) {
      if (best[name] === undefined) { best[name] = v; continue; }
      if (v > best[name]) { list.push({ d: r.d, name, old: best[name], v }); best[name] = v; }
    }
  }
  $("pbs").innerHTML = list.length
    ? `<thead><tr><th>日時</th><th>項目</th><th>更新前</th><th></th><th>更新後</th><th>伸び</th></tr></thead><tbody>` +
      list.reverse().map(p => `<tr><td>${fmtDate(p.d)} ${fmtTime(p.d)}</td><td>${p.name}</td><td class="q">${p.old}</td>
        <td class="q">→</td><td class="hl">${p.v}</td><td class="rec">+${p.v - p.old}</td></tr>`).join("") + `</tbody>`
    : `<tbody><tr><td class="empty">まだ更新はありません（このシフトの2回目以降のバイトで記録を超えると出ます）</td></tr></tbody>`;
}

function renderWaves() {
  const maxW = Math.max(0, ...runs.map(r => r.waves.length));
  if (!maxW) { $("waves").innerHTML = `<tbody><tr><td class="empty">まだ記録がありません</td></tr></tbody>`; return; }
  // 1行ぶん: 最高・最高を出した回数・最初に最高を出した日時（同じ最高を何回も出したら全部の日時をツールチップに）
  const row = (name, list, val, cls = "") => {
    const vals = list.map(val);
    const best = Math.max(...vals);
    const bestRuns = list.filter(r => val(r) === best);
    const when = bestRuns.map(r => `${fmtDate(r.d)} ${fmtTime(r.d)}`);
    return `<tr class="${cls}"><td>${name}</td><td class="hl">${best}</td>
      <td>${bestRuns.length}回<span class="q">（${Math.round(bestRuns.length / list.length * 100)}%）</span></td>
      <td title="${esc(when.join("\n"))}">${when[0]}${when.length > 1 ? `<span class="q"> ほか${when.length - 1}回</span>` : ""}</td>
      <td>${r1(avg(vals))}</td><td>${list.length}</td></tr>`;
  };
  let rows = "";
  for (let i = 0; i < maxW; i++) {
    rows += row(`WAVE ${i + 1}`, runs.filter(r => r.waves[i]), r => r.waves[i][0]);
  }
  rows += row("合計", runs, r => r.total, "total");
  const dream = dreamTotal();
  if (dream) {
    rows += `<tr><td>全WAVEの最高を足すと</td><td class="hl">${dream}</td>
      <td colspan="4" class="q">いまの最高合計より ${dream - Math.max(...runs.map(r => r.total))}個 多い</td></tr>`;
  }
  $("waves").innerHTML = `<thead><tr><th></th><th>最高</th><th>最高を出した回数（割合）</th><th>最高を出した時刻</th><th>平均</th><th>バイト回数</th></tr></thead><tbody>${rows}</tbody>`;
}

let detailKey = "WAVE1";  // 詳細を見るWAVE（"合計" も可）
let detailPage = 0;       // 何ページ目か（0から）
const DETAIL_PER_PAGE = 50;

function renderDetail() {
  const maxW = Math.max(0, ...runs.map(r => r.waves.length));
  const keys = [...Array.from({ length: maxW }, (_, i) => `WAVE${i + 1}`), "合計"];
  if (!keys.includes(detailKey)) detailKey = keys[0] || "合計";
  $("detailTabs").innerHTML = keys.map(k =>
    `<button role="tab" aria-selected="${k === detailKey}" data-k="${k}">${k.replace("WAVE", "WAVE ")}</button>`).join("");
  $("detailTabs").querySelectorAll("button").forEach(b => b.onclick = () => { detailKey = b.dataset.k; detailPage = 0; renderDetail(); });

  const wi = detailKey === "合計" ? -1 : Number(detailKey.slice(4)) - 1;
  const list = wi < 0 ? runs : runs.filter(r => r.waves[wi]);
  if (!list.length) { $("detailSum").innerHTML = ""; $("detail").innerHTML = `<tbody><tr><td class="empty">まだ記録がありません</td></tr></tbody>`; return; }
  const val = r => (wi < 0 ? r.total : r.waves[wi][0]);
  const vals = list.map(val).sort((a, b) => a - b);
  const median = vals.length % 2 ? vals[(vals.length - 1) / 2] : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2;

  // ノルマ達成（金イクラ ≥ ノルマ）の回数。合計には無い
  let quotaText = "";
  if (wi >= 0) {
    const ok = list.filter(r => r.waves[wi][0] >= r.waves[wi][1]).length;
    quotaText = `<span>ノルマ達成 <b>${ok}</b>/${list.length}回（${Math.round(ok / list.length * 100)}%）</span>`;
  }
  $("detailSum").innerHTML =
    `<span>回数 <b>${list.length}</b>回</span><span>最高 <b>${vals[vals.length - 1]}</b></span>` +
    `<span>最低 <b>${vals[0]}</b></span><span>平均 <b>${r1(avg(vals))}</b></span><span>中央値 <b>${median}</b></span>` + quotaText;

  // 金イクラの数ごとに、何回出たか
  const map = new Map();
  for (const r of list) {
    const v = val(r);
    if (!map.has(v)) map.set(v, []);
    map.get(v).push(r);
  }
  const most = Math.max(...[...map.values()].map(a => a.length));
  const top = vals[vals.length - 1];
  const rows = [...map.entries()].sort((a, b) => b[0] - a[0]).map(([v, rs]) => {
    const last = rs[rs.length - 1].d;
    const under = wi >= 0 && rs.every(r => r.waves[wi][0] < r.waves[wi][1]);
    return `<tr class="${v === top ? "top" : ""}${under ? " under" : ""}"><td>${v}個</td><td>${rs.length}回</td>
      <td>${Math.round(rs.length / list.length * 1000) / 10}%</td>
      <td class="bar"><span class="b" style="width:${rs.length / most * 100}%"></span></td>
      <td class="q">${fmtDate(last)} ${fmtTime(last)}</td></tr>`;
  });
  // 多い順に50件ずつ表示して、ページを切り替えられるようにする
  const pages = Math.max(1, Math.ceil(rows.length / DETAIL_PER_PAGE));
  detailPage = Math.min(detailPage, pages - 1);
  const from = detailPage * DETAIL_PER_PAGE;
  $("detail").innerHTML = `<thead><tr><th>金イクラ</th><th>回数</th><th>割合</th><th></th><th>最後に出した日時</th></tr></thead>` +
    `<tbody>${rows.slice(from, from + DETAIL_PER_PAGE).join("")}</tbody>`;
  $("detailPager").innerHTML = pages > 1
    ? `<button data-p="${detailPage - 1}"${detailPage === 0 ? " disabled" : ""}>← 前へ</button>
       <span>${from + 1}〜${Math.min(from + DETAIL_PER_PAGE, rows.length)}件目 / 全${rows.length}件（${detailPage + 1}/${pages}ページ）</span>
       <button data-p="${detailPage + 1}"${detailPage === pages - 1 ? " disabled" : ""}>次へ →</button>`
    : "";
  $("detailPager").querySelectorAll("button").forEach(b => b.onclick = () => { detailPage = Number(b.dataset.p); renderDetail(); });
}

let chartKey = "合計";  // "合計" か "WAVE1" 〜

function renderChartTabs() {
  const maxW = Math.max(0, ...runs.map(r => r.waves.length));
  const keys = ["合計", ...Array.from({ length: maxW }, (_, i) => `WAVE${i + 1}`)];
  if (runs.some(r => typeof r.red === "number")) keys.push("赤イクラ");
  if (!keys.includes(chartKey)) chartKey = "合計";
  $("chartTabs").innerHTML = keys.map(k =>
    `<button role="tab" aria-selected="${k === chartKey}" data-k="${k}">${k.replace("WAVE", "WAVE ")}</button>`).join("");
  $("chartTabs").querySelectorAll("button").forEach(b => b.onclick = () => { chartKey = b.dataset.k; renderChartTabs(); renderChart(); });
}

let chartRange = 0;  // 0 = すべて、それ以外は直近N回
let chartType = "bar";  // line = 折れ線 / bar = 棒グラフ
let chartPts = [];   // ツールチップ用 [{x, y, r}]

function renderChart() {
  // 合計 / そのWAVEまで進んだバイト / 赤イクラを読めたバイト
  const wi = chartKey === "合計" ? -1 : chartKey === "赤イクラ" ? -2 : Number(chartKey.slice(4)) - 1;
  const all = wi === -1 ? runs : wi === -2 ? runs.filter(r => typeof r.red === "number") : runs.filter(r => r.waves[wi]);
  const val = r => (wi === -1 ? r.total : wi === -2 ? r.red : r.waves[wi][0]);
  const tip = $("chartTip");
  tip.hidden = true;
  if (all.length < 2) { $("chart").innerHTML = `<div class="empty">2回以上のリザルトがたまるとグラフが出ます</div>`; chartPts = []; return; }

  // 「最高記録を更新した回」は「すべて」の流れで判定して、表示する範囲だけ切り出す
  const vals = all.map(val);
  const bestAt = [];
  let b = -Infinity;
  vals.forEach(v => { b = Math.max(b, v); bestAt.push(b); });
  const bars = chartType === "bar";
  const start = chartRange && all.length > chartRange ? all.length - chartRange : 0;
  const list = all.slice(start);
  const n = list.length;
  const v = i => vals[start + i];

  // 画面の幅に合わせて描く（スマホでも文字や点が小さくならない）
  const W = Math.max(300, $("chart").clientWidth || 600);
  const H = Math.round(Math.min(380, Math.max(240, W * 0.42)));
  const L = 46, R = 58, T = 14, B = 30;
  const shown = list.map((_, i) => v(i));
  let lo = Math.min(...shown), hi = Math.max(...shown);
  const u = wi === -2 ? 500 : 10;
  const pad = Math.max(u, (hi - lo) * 0.08);
  lo = Math.max(0, Math.floor((lo - pad) / u) * u); hi = Math.ceil((hi + pad) / u) * u;
  const slot = (W - L - R) / n;
  const x = i => bars ? L + (i + 0.5) * slot : L + (n === 1 ? (W - L - R) / 2 : (i / (n - 1)) * (W - L - R));
  const y = val_ => T + (1 - (val_ - lo) / (hi - lo)) * (H - T - B);

  const label = wi === -2 ? "赤イクラの推移" : chartKey.replace("WAVE", "WAVE ") + "の金イクラの推移";
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${label}">`;
  const step = Math.max(u, Math.ceil((hi - lo) / 5 / u) * u);
  for (let g = lo; g <= hi; g += step) {
    svg += `<line class="axis" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/>
      <text class="tick" x="${L - 6}" y="${y(g) + 4}" text-anchor="end">${g}</text>`;
  }

  // 横軸: 日付が変わったところ（太字）、1時間以上あいた後、等間隔の時刻
  const cand = [];
  let lastDay = "";
  list.forEach((r, i) => {
    const k = dayKey(r.d);
    if (k !== lastDay) { cand.push({ i, text: `${fmtDate(r.d)} ${fmtTime(r.d)}`, rank: 0 }); lastDay = k; }
    else if (i && r.d - list[i - 1].d > 3600e3) cand.push({ i, text: fmtTime(r.d), rank: 1 });
  });
  const every = Math.max(1, Math.round(n / Math.max(2, Math.floor((W - L - R) / 90))));
  for (let i = 0; i < n; i += every) cand.push({ i, text: fmtTime(list[i].d), rank: 2 });
  // 文字の置き場所（端ではみ出さないように寄せた位置）で重なりを調べる
  const halfOf = c => (c.rank === 0 ? 38 : 16);
  const posOf = c => Math.min(W - R - halfOf(c), Math.max(L + halfOf(c), x(c.i)));
  const ticks = [];
  for (const c of cand.sort((a, b2) => a.rank - b2.rank)) {
    if (ticks.some(t => t.i === c.i || Math.abs(posOf(t) - posOf(c)) < halfOf(t) + halfOf(c) + 8)) continue;
    ticks.push(c);
  }
  list.forEach((r, i) => {
    if (i && r.d - list[i - 1].d > 3600e3) {
      const bx = (x(i - 1) + x(i)) / 2;
      svg += `<line class="brk" x1="${bx}" x2="${bx}" y1="${T}" y2="${H - B}"/>`;
    }
  });
  for (const t of ticks) {
    const tx = posOf(t);
    svg += `<line class="vtick" x1="${x(t.i)}" x2="${x(t.i)}" y1="${H - B}" y2="${H - B + 5}"/>
      <text class="tick${t.rank === 0 ? " day" : ""}" x="${tx}" y="${H - 9}" text-anchor="middle">${t.text}</text>`;
  }

  // 最高記録の高さに薄い点線（右端に数字）
  const top = bestAt[all.length - 1];
  svg += `<line class="bestref" x1="${L}" x2="${W - R}" y1="${y(top)}" y2="${y(top)}"/>
    <text class="endlabel best" x="${W - R + 6}" y="${y(top) + 4}">${top}</text>`;

  // クリア＝緑、失敗＝赤、いまの最高記録を出したバイト＝金色
  const r0 = n > 120 ? 2.5 : n > 50 ? 3.2 : 4;
  const topAt = vals.lastIndexOf(top);  // 最高記録が何回かあるときは、一番最近のものだけ金色にする
  const kindOfRun = (r, gi) => (gi === topAt ? "rec" : r.clear === false ? "fail" : "ok");
  chartPts = [];
  if (bars) {
    const bw = Math.max(2, Math.min(28, slot * 0.72));
    list.forEach((r, i) => {
      const k = kindOfRun(r, start + i);
      svg += `<rect class="bar ${k}" x="${x(i) - bw / 2}" y="${y(v(i))}" width="${bw}" height="${Math.max(1, y(lo) - y(v(i)))}" rx="${Math.min(3, bw / 3)}"/>`;
      chartPts.push({ x: x(i), y: y(v(i)), r, v: v(i), rec: k === "rec" });
    });
  } else {
    // 1回ごとの記録を順番に線で結ぶ
    svg += `<path class="line" d="${list.map((_, i) => `${i ? "L" : "M"}${x(i)},${y(v(i))}`).join("")}"/>`;
    list.forEach((r, i) => {
      const k = kindOfRun(r, start + i);
      svg += `<circle class="pt ${k}" cx="${x(i)}" cy="${y(v(i))}" r="${k === "rec" ? r0 + 1.5 : r0}"/>`;
      chartPts.push({ x: x(i), y: y(v(i)), r, v: v(i), rec: k === "rec" });
    });
  }
  svg += `<g id="chartHover"></g></svg>`;
  $("chart").innerHTML = svg;

  // マウス／タップで一番近いバイトの記録を出す
  const el = $("chart").querySelector("svg");
  const show = ev => {
    const rect = el.getBoundingClientRect();
    const px = (ev.clientX - rect.left) * (W / rect.width);
    let best = null;
    for (const p of chartPts) if (!best || Math.abs(p.x - px) < Math.abs(best.x - px)) best = p;
    if (!best) return;
    const r = best.r;
    const quota = wi >= 0 ? ` <span class="q">/ ノルマ ${r.waves[wi][1]}</span>` : "";
    const res = r.clear === true ? '<span class="ok">クリア</span>' : r.clear === false ? '<span class="ng">失敗</span>' : "";
    tip.innerHTML = `${fmtDate(r.d)} ${fmtTime(r.d)} ${res}<br><b>${best.v}</b>個${quota}` +
      (best.rec ? ` <span class="rec">最高記録</span>` : "") +
      (wi === -1 && typeof r.red === "number" ? `<br><span class="q">赤イクラ ${r.red}</span>` : "");
    tip.hidden = false;
    const left = best.x * (rect.width / W);
    tip.style.left = Math.min(rect.width - tip.offsetWidth - 4, Math.max(4, left - tip.offsetWidth / 2)) + "px";
    tip.style.top = Math.max(4, best.y * (rect.height / H) - tip.offsetHeight - 14) + "px";
    $("chartHover").innerHTML = `<line class="guide" x1="${best.x}" x2="${best.x}" y1="${T}" y2="${H - B}"/>
      <circle class="hl" cx="${best.x}" cy="${best.y}" r="${r0 + 4}"/>`;
  };
  el.addEventListener("pointermove", show);
  el.addEventListener("pointerdown", show);
  el.addEventListener("pointerleave", () => { tip.hidden = true; $("chartHover").innerHTML = ""; });
}

document.querySelectorAll("#chartType button").forEach(b => b.addEventListener("click", () => {
  chartType = b.dataset.t;
  document.querySelectorAll("#chartType button").forEach(x => x.setAttribute("aria-selected", x === b));
  renderChart();
}));
document.querySelectorAll("#chartRange button").forEach(b => b.addEventListener("click", () => {
  chartRange = Number(b.dataset.n);
  document.querySelectorAll("#chartRange button").forEach(x => x.setAttribute("aria-selected", x === b));
  renderChart();
}));
// 画面の幅が変わったら描き直す
let chartResizeTimer = null;
addEventListener("resize", () => { clearTimeout(chartResizeTimer); chartResizeTimer = setTimeout(renderChart, 150); });

function renderAll() {
  const every = pickAll(selected);  // 「?」がある回も含めて全部
  const maxW = Math.max(0, ...every.map(r => r.waves.length));
  const list = every.slice().reverse().slice(0, shown);
  const qn = v => (v == null ? '<span class="unk">?</span>' : v);
  const head = `<tr><th>日時</th><th>結果</th>${Array.from({ length: maxW }, (_, i) => `<th>W${i + 1}</th>`).join("")}<th>合計</th><th>赤イクラ</th></tr>`;
  const result = r => (r.clear === true ? '<span class="ok">クリア</span>' : r.clear === false ? '<span class="ng">失敗</span>' : '<span class="q">−</span>')
    + (r.ex === true ? '<span class="q"> / </span><span class="ok">オカシラ撃破</span>' : r.ex === false ? '<span class="q"> / オカシラNG</span>' : "");
  const body = list.map(r => {
    const cells = Array.from({ length: maxW }, (_, i) => {
      const w = r.waves[i];
      if (!w) return "<td></td>";
      const isNew = r.new && r.new.includes(`WAVE${i + 1}`);
      return `<td${isNew ? ' class="rec"' : ""}>${qn(w[0])}<span class="q">/${qn(w[1])}</span></td>`;
    }).join("");
    const isNew = r.new && r.new.includes("合計");
    return `<tr><td>${fmtDate(r.d)} ${fmtTime(r.d)}</td><td>${result(r)}</td>${cells}<td${isNew ? ' class="rec"' : ""}><b>${qn(r.total)}</b></td>
      <td>${typeof r.red === "number" ? r.red : '<span class="q">−</span>'}</td></tr>`;
  }).join("");
  const unknown = every.filter(r => !r.complete).length;
  $("allNote").innerHTML = unknown
    ? `<span class="unk">?</span> は読み取れなかった数字です（${unknown}回）。この回は直すまで集計に入りません。` : "";
  $("all").innerHTML = every.length ? `<thead>${head}</thead><tbody>${body}</tbody>`
    : `<tbody><tr><td class="empty">まだ記録がありません</td></tr></tbody>`;
  $("more").innerHTML = every.length > shown ? `<button id="moreBtn">もっと見る（残り${every.length - shown}件）</button>` : "";
  const btn = $("moreBtn");
  if (btn) btn.onclick = () => { shown += 50; renderAll(); };
}

function render() {
  renderShiftPicker(); renderCards(); renderBestRun(); renderWaves(); renderChartTabs(); renderChart(); renderDetail();
  renderRed(); renderHours(); renderPBs(); renderShiftList(); renderAll();
  const last = allRuns[allRuns.length - 1];
  $("updated").textContent = last ? `最終更新 ${fmtDate(last.d)} ${fmtTime(last.d)}` : "";
}

$("shift").addEventListener("change", e => select(e.target.value));

// クリア / 失敗 で絞り込む（クリア判定ができなかったバイトは「すべて」のときだけ出る）
document.querySelectorAll("#clearFilter button").forEach(b => b.addEventListener("click", () => {
  clearFilter = b.dataset.f;
  document.querySelectorAll("#clearFilter button").forEach(x => x.setAttribute("aria-selected", x === b));
  runs = pick(selected);
  shown = 30;
  detailPage = 0;
  render();
}));
async function getJson(name, fallback) {
  try {
    const res = await fetch(name + "?t=" + Date.now(), { cache: "no-store" });
    return res.ok ? await res.json() : fallback;
  } catch (e) {
    return fallback;
  }
}

async function load() {
  const [data, sh] = await Promise.all([getJson("results.json", []), getJson("shifts.json", {})]);
  shifts = sh || {};
  allRuns = (Array.isArray(data) ? data : []).map(r => ({
    ...r, d: new Date(r.time),
    // 読めなかった数字（?）がある回は、直すまで集計に入れない
    complete: r.total != null && r.waves.every(w => w[0] != null && w[1] != null),
  })).sort((a, b) => a.d - b.d);
  const keys = shiftKeys();
  if (!selected || !keys.includes(selected)) {
    const fromHash = decodeURIComponent(location.hash.slice(1));
    // 最初は一番新しいコンテストのシフト（無ければ一番新しいシフト）
    const latest = keys.find(k => kindOf(k) === "contest") || keys[0] || null;
    selected = keys.includes(fromHash) ? fromHash : latest;
  }
  runs = pick(selected);
  render();
}load();
setInterval(load, 60000); // 開いたままでも1分ごとに最新にする
</script>
</body>
</html>
